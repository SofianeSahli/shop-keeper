name: shop-keeper

x-php: &php
  image: shop-keeper-php
  pull_policy: never
  user: ${HOST_UID:-1000}:${HOST_GID:-1000}
  volumes:
    - .:/var/www/html
    - vendor:/var/www/html/vendor

services:
  setup:
    <<: *php
    pull_policy: missing
    build:
      context: docker/php
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    command: sh docker/php/setup.sh
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  app:
    <<: *php
    restart: unless-stopped
    depends_on:
      setup:
        condition: service_completed_successfully

  queue:
    <<: *php
    command: php artisan queue:listen redis --tries=3 --backoff=30
    restart: unless-stopped
    depends_on:
      setup:
        condition: service_completed_successfully

  web:
    image: nginx:1.30.6-alpine
    restart: unless-stopped
    ports:
      - 127.0.0.1:${APP_PORT:-8000}:80
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: wget --quiet --spider http://127.0.0.1/up
      interval: 10s
      timeout: 5s
      retries: 6
    depends_on:
      - app

  mysql:
    image: mysql:8.4.13
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-shop_keeper}
      MYSQL_USER: ${DB_USERNAME:-shop_keeper}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    ports:
      - 127.0.0.1:${DB_FORWARD_PORT:-3307}:3306
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: mysqladmin ping --host=127.0.0.1 --user=root --password="$$MYSQL_ROOT_PASSWORD" --silent
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7.4.12-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: redis-cli ping
      interval: 5s
      timeout: 3s
      retries: 6

  mailpit:
    image: axllent/mailpit:v1.33.0
    restart: unless-stopped
    ports:
      - 127.0.0.1:${MAILPIT_PORT:-8025}:8025

volumes:
  vendor:
  mysql-data:
  redis-data:
